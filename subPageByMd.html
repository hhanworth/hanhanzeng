<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown 查看器</title>
    <link rel="stylesheet" type="text/css" href="stylesheet.css">
    <style>
        /* Lightweight local adjustments to override body constraints from stylesheet.css */
        body {
            max-width: 800px;
            margin: 0 auto;
            padding: 4rem 1.5rem;
        }

        @media (max-width: 600px) {
            body {
                padding: 2rem 1rem;
            }
        }

        #markdown-content {
            opacity: 0;
            animation: fadeInUp 0.8s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
        }

        #markdown-content h1,
        #markdown-content h2,
        #markdown-content h3,
        #markdown-content h4 {
            font-family: var(--font-family);
            color: var(--text-primary);
            font-weight: 600;
            line-height: 1.3;
            margin-top: 2rem;
            margin-bottom: 1rem;
        }

        #markdown-content h1 {
            font-size: 1.8rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        #markdown-content h2 {
            font-size: 1.4rem;
            border-bottom: 1px solid var(--border-color-muted);
            padding-bottom: 0.4rem;
        }

        #markdown-content h3 {
            font-size: 1.15rem;
        }

        #markdown-content p {
            margin-bottom: 1.25rem;
            line-height: 1.8;
        }

        #markdown-content ul,
        #markdown-content ol {
            margin-bottom: 1.25rem;
            padding-left: 1.5rem;
            color: var(--text-secondary);
        }

        #markdown-content li {
            margin-bottom: 0.5rem;
        }

        #markdown-content pre {
            background-color: #1e1e1c;
            color: #f5f5f0;
            padding: 1.25rem;
            overflow-x: auto;
            border-radius: var(--radius-md);
            border: 1px solid #2d2d2a;
            margin-bottom: 1.25rem;
            font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        #markdown-content code {
            background-color: #f2f2eb;
            color: #a8582b;
            padding: 0.2em 0.4em;
            border-radius: 4px;
            font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 0.85em;
        }

        #markdown-content pre code {
            background-color: transparent;
            color: inherit;
            padding: 0;
            border-radius: 0;
            font-size: inherit;
        }

        #markdown-content img {
            max-width: 100%;
            height: auto;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            margin: 1.5rem 0;
            transition: var(--transition-surface);
        }

        #markdown-content img:hover {
            border-color: var(--accent-color);
            box-shadow: var(--shadow-hover);
        }

        #markdown-content blockquote {
            border-left: 3px solid var(--accent-color);
            padding-left: 1rem;
            margin-bottom: 1.25rem;
            color: var(--text-muted);
            font-style: italic;
        }

        #markdown-content a {
            color: var(--accent-color);
            text-decoration: none;
            border-bottom: 1px solid var(--border-color);
            transition: var(--transition-colors);
        }

        #markdown-content a:hover {
            color: var(--accent-hover);
            border-bottom-color: var(--accent-hover);
        }
    </style>
</head>

<body>

    <main id="markdown-content" class="reveal">正在加载 Markdown…</main>

    <!-- marked.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const file = params.get('file')+'.md';

        if (file) {
            const mdDir = file.includes('/') ? file.slice(0, file.lastIndexOf('/') + 1) : '';

            fetch(file)
                .then(res => {
                    if (!res.ok) throw new Error('无法读取 Markdown 文件：' + res.status+ file);
                    return res.text();
                })
                .then(mdText => {
                    const contentEl = document.getElementById('markdown-content');
                    contentEl.innerHTML = marked.parse(mdText);
                    // Fade in the parsed content smoothly
                    contentEl.style.opacity = '1';

                    // 修正所有 <img>
                    document.querySelectorAll('#markdown-content img').forEach(img => {
                        const src = img.getAttribute('src') || '';
                        // 如果是相对路径，就加前缀
                        if (!/^([a-z]+:)?\/\//i.test(src) && !src.startsWith('/')) {
                            img.src = mdDir + src;
                        }
                    });
                })
                .catch(err => {
                    document.getElementById('markdown-content').textContent = err.message;
                    document.getElementById('markdown-content').style.opacity = '1';
                });
        }
    </script>

</body>

</html>
